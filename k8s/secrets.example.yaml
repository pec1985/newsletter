# Copy to secrets.yaml and supply production values. Never commit secrets.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: newsletter-env
type: Opaque
stringData:
  DATABASE_URL: "REPLACE_WITH_PRODUCTION_POSTGRES_URL"
  # Generate once with: rtk openssl rand -hex 32. Keep stable across deployments.
  SETTINGS_ENCRYPTION_KEY: "REPLACE_WITH_64_HEX_CHARACTERS"
