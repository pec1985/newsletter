apiVersion: apps/v1
kind: Deployment
metadata:
  name: newsletter
  namespace: ${NAMESPACE}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: newsletter
  template:
    metadata:
      labels:
        app: newsletter
      annotations:
        newsletter/config-revision: ${CONFIG_REVISION}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      imagePullSecrets: ${IMAGE_PULL_SECRETS}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: newsletter
          image: ${IMAGE}
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - secretRef:
                name: newsletter-env
          env:
            - name: ORIGIN
              value: ${APP_ORIGIN}
            - name: APP_ORIGIN
              value: ${APP_ORIGIN}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
        - name: email-worker
          image: ${IMAGE}
          imagePullPolicy: Always
          command: ["bun", "scripts/worker.ts"]
          envFrom:
            - secretRef:
                name: newsletter-env
          env:
            - name: APP_ORIGIN
              value: ${APP_ORIGIN}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
